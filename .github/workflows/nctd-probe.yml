name: NCTD probe (throwaway)

# A one-off diagnostic, dispatched by hand and removed again: NCTD's server
# (lfportal.nctd.org, which holds Coaster's and Sprinter's timetable) resets
# every connection from the weekly runs while answering at once from
# elsewhere. The first probe found curl and Ubuntu's own Python both served
# from a runner; the runs download with the Python actions/setup-python
# installs. So this one compares the two Pythons' OpenSSL builds and
# handshakes, with a packet capture to show where the reset lands.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: https://lfportal.nctd.org/staticGTFS/google_transit.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The two Pythons
        run: |
          echo "runner address: $(curl -sS -4 --max-time 15 https://api.ipify.org)"
          echo "system:       $(/usr/bin/python3 -c 'import ssl, sys; print(sys.version.split()[0], ssl.OPENSSL_VERSION)')"
          echo "setup-python: $(python3 -c 'import ssl, sys; print(sys.version.split()[0], ssl.OPENSSL_VERSION, sys.executable)')"
          echo "curl:         $(curl --version | head -1)"

      - name: Download with each, under a packet capture
        run: |
          set +e
          cat > "$RUNNER_TEMP/try.py" <<'PY'
          import os, ssl, sys, urllib.request
          url = os.environ["URL"]
          mode = sys.argv[1]
          ctx = ssl.create_default_context()
          if mode == "x25519-only":
              ctx.set_ecdh_curve("X25519")       # one small key share, no post-quantum one
          elif mode == "tls1.2":
              ctx.maximum_version = ssl.TLSVersion.TLSv1_2   # no key_share extension at all
          elif mode == "groups":
              try: ctx.set_groups("X25519:P-256:X448:P-521:P-384")   # OpenSSL's pre-3.5 default list
              except AttributeError as err: print("   (no set_groups:", err, ")")
          req = urllib.request.Request(url, headers={"User-Agent": "trainsheet-build"})
          try:
              with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                  print(f"   {mode}: HTTP {r.status}, {len(r.read())} bytes, TLS {r.fp.raw._sock.version() if hasattr(r.fp.raw, '_sock') else '?'}")
          except Exception as err:
              print(f"   {mode}: {type(err).__name__}: {err}")
          PY
          sudo tcpdump -i any -nn -s 200 -w "$RUNNER_TEMP/cap.pcap" host 216.102.19.245 2>/dev/null &
          sleep 2
          for py in /usr/bin/python3 python3; do
            for mode in default x25519-only tls1.2 groups; do
              echo "--- $py $mode"; "$py" "$RUNNER_TEMP/try.py" "$mode"; sleep 1
            done
          done
          echo "--- setup-python, the build's own downloader (feeds.get_raw, one try)"
          python3 -c "
          import sys; sys.path.insert(0, 'scripts'); import feeds
          try: print('   ', len(feeds.get_raw('$URL')), 'bytes')
          except Exception as err: print('   ', type(err).__name__, err)"
          sleep 2; sudo pkill tcpdump; sleep 1
          echo "--- packets (client hello sizes and where the resets land)"
          sudo tcpdump -r "$RUNNER_TEMP/cap.pcap" -nn 2>/dev/null | grep -vE 'length 0$' | awk '{print $1, $3, $4, $5, $NF, $0 ~ /\[R/ ? "RST" : ""}' | cut -c1-120 | head -120

      - name: TLS 1.3-only handshake with each OpenSSL (does the server reset or alert?)
        run: |
          set +e
          echo "--- system openssl $(openssl version)"
          echo | timeout 20 openssl s_client -connect lfportal.nctd.org:443 -servername lfportal.nctd.org -tls1_3 2>&1 | grep -E 'errno|alert|Protocol' | head -3
          echo "--- system openssl, default groups, TLS 1.2+1.3 offered"
          echo | timeout 20 openssl s_client -connect lfportal.nctd.org:443 -servername lfportal.nctd.org 2>&1 | grep -E 'errno|alert|Protocol|Cipher ' | head -3
          echo "--- system openssl, groups X25519MLKEM768:X25519 (post-quantum key share first)"
          echo | timeout 20 openssl s_client -connect lfportal.nctd.org:443 -servername lfportal.nctd.org -groups X25519MLKEM768:X25519 2>&1 | grep -E 'errno|alert|Protocol|Cipher |unknown|Error' | head -3
