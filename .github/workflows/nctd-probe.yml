name: NCTD probe (throwaway)

# A one-off diagnostic, dispatched by hand and removed again. The first
# three probes found NCTD's server resets the TLS handshake of the Python
# actions/setup-python installs because its default context offers no
# plain-RSA cipher suite, and feeds.get_raw now offers OpenSSL's own list.
# The first stations run with that list downloaded NCTD's feed and got a 403
# from SunRail's server, which the run before had served: this one fetches
# every feed in the table with both contexts, and with curl, to see whether
# the wider list changes any other server's answer.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every feed, with Python's default context, with OpenSSL's list, and with curl
        run: |
          set +e
          echo "runner address: $(curl -sS -4 --max-time 15 https://api.ipify.org)"
          python3 - <<'PY'
          import ssl, subprocess, sys, urllib.request
          sys.path.insert(0, "scripts"); import feeds
          urls = {}
          for agency, (url, *_) in feeds.GTFS.items():
              urls.setdefault(url, []).append(agency)
          urls.setdefault(feeds.AMTRAK_GTFS, []).append("amtrak"); urls.setdefault(feeds.VIA_GTFS, []).append("via")
          narrow = ssl.create_default_context()
          wide = ssl.create_default_context(); wide.set_ciphers("DEFAULT")
          def py(url, ctx):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "trainsheet-build"}), timeout=60, context=ctx) as r:
                      return f"{r.status} {r.read(2)!r}"
              except Exception as err:
                  return f"{type(err).__name__}: {str(err)[:60]}"
          def curl(url):
              p = subprocess.run(["curl", "-sS", "-o", "/dev/null", "--max-time", "60", "-A", "trainsheet-build", "-w", "%{http_code}", url], capture_output=True, text=True)
              return p.stdout.strip() + (" " + p.stderr.strip()[:50] if p.stderr.strip() else "")
          for url, agencies in urls.items():
              a, b, c = py(url, narrow), py(url, wide), curl(url)
              flag = "" if a == b else "   <-- differs"
              print(f"{'/'.join(agencies):>18}: default {a:<28} DEFAULT {b:<28} curl {c}{flag}")
          PY
