<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrainTracker</title>
  <meta name="description" content="Live map of passenger trains across the United States — Amtrak, Brightline and commuter railroads in one place.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5fad'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css?v=dev">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="config.js?v=dev"></script>
</head>
<body>
  <div id="map" aria-label="Map of live train positions"></div>

  <aside id="panel" class="panel" aria-label="Trains">
    <button class="sheet-handle" id="sheet-handle" aria-label="Expand or collapse panel"></button>

    <!-- List view -->
    <section id="view-list">
      <header class="brand">
        <div>
          <h1>TrainTracker</h1>
          <p class="live"><span class="pulse" aria-hidden="true"></span><span id="live-count">Loading trains…</span></p>
        </div>
        <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.8a7 7 0 0 1 0 1.9l2 1.8-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6a7 7 0 0 1-1.7-.9l-2.5.9-1.7-2.9 2-1.8a7 7 0 0 1 0-1.9l-2-1.8 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9L10.3 2ZM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" transform="translate(0 1)"/></svg>
        </button>
      </header>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
        <input id="search" type="search" placeholder="Train, station, line, or city" autocomplete="off" spellcheck="false">
      </div>

      <div class="segmented" role="tablist" id="kind-filter">
        <button role="tab" data-kind="all" aria-selected="true">All</button>
        <button role="tab" data-kind="intercity" aria-selected="false">Intercity</button>
        <button role="tab" data-kind="commuter" aria-selected="false">Commuter</button>
      </div>

      <div id="results" class="results" hidden></div>
      <div id="agencies" class="agencies"></div>

      <footer class="foot">
        <details>
          <summary>About the data</summary>
          <p>Positions come from each railroad's public real-time feed and refresh every 20–60 seconds. Trains marked <em>estimated</em> are placed between stations using predicted arrival times because their feed doesn't report GPS.</p>
          <p id="credits"></p>
          <p><a href="https://github.com/0kweather/traintracker">Source on GitHub</a></p>
        </details>
      </footer>
    </section>

    <!-- Train detail view -->
    <section id="view-train" hidden>
      <div class="detail-top">
        <button class="back" id="back-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="m14.7 5.3 1.4 1.4L10.8 12l5.3 5.3-1.4 1.4L8 12z"/></svg>
          All trains
        </button>
        <button class="icon-btn" id="follow-btn" title="Keep this train centered" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm-1-6h2v3.06A7 7 0 0 1 18.94 11H22v2h-3.06A7 7 0 0 1 13 18.94V22h-2v-3.06A7 7 0 0 1 5.06 13H2v-2h3.06A7 7 0 0 1 11 5.06Zm1 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
        </button>
      </div>
      <div id="train-detail"></div>
    </section>
  </aside>

  <div id="settings-menu" class="menu" role="dialog" aria-label="Settings" hidden>
    <div class="menu-title">Appearance</div>
    <div class="segmented" id="theme-choice">
      <button data-theme-choice="auto">Auto</button>
      <button data-theme-choice="light">Light</button>
      <button data-theme-choice="dark">Dark</button>
    </div>
    <div class="menu-title">Map</div>
    <label class="toggle">
      <input type="checkbox" id="estimate-toggle">
      <span class="switch" aria-hidden="true"></span>
      <span class="toggle-text"><strong>Estimate live location</strong><span>Moves trains between reports using speed, predicted arrivals and the track</span></span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="stations-toggle">
      <span class="switch" aria-hidden="true"></span>
      <span class="toggle-text"><strong>Show stations</strong><span>Station markers and names on the map</span></span>
    </label>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js?v=dev"></script>
</body>
</html>
